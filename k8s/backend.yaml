apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: opsinsight
data:
  DATABASE_URL: postgresql://opsinsight:opsinsight@postgres:5432/opsinsight
  CORS_ORIGINS: '["http://localhost:3000","http://opsinsight.local"]'
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: opsinsight
type: Opaque
stringData:
  SECRET_KEY: change-me-in-production-use-a-strong-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: opsinsight
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: opsinsight-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: opsinsight
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
